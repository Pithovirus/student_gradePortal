<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-100">
    <nav class="bg-blue-600 text-white p-4 flex justify-between">
      <h1 class="font-bold">Student Portal</h1>

      <button id="logoutBtn" class="bg-red-500 px-4 py-2 rounded">
        Logout
      </button>
    </nav>

    <div class="max-w-4xl mx-auto mt-10">
      <div class="bg-white shadow rounded-xl p-8">
        <h2 class="text-2xl font-bold mb-6">Student Information</h2>

        <div class="grid md:grid-cols-2 gap-4">
          <div>
            <p class="text-gray-500">Name</p>
            <p id="studentName" class="font-semibold"></p>
          </div>

          <div>
            <p class="text-gray-500">Email</p>
            <p id="studentEmail" class="font-semibold"></p>
          </div>

          <div>
            <p class="text-gray-500">Course</p>
            <p id="studentCourse" class="font-semibold"></p>
          </div>
        </div>
      </div>

      <div class="bg-white shadow rounded-xl p-8 mt-6">
        <h2 class="text-2xl font-bold mb-6">Grades</h2>

        <div class="grid md:grid-cols-2 gap-6">
          <!-- <div class="bg-blue-100 p-6 rounded-xl">
            <h3 class="font-bold">Midterm Grade</h3>

            <p id="midterm" class="text-4xl font-bold text-blue-600"></p>
          </div> -->

          <div class="bg-green-100 p-6 rounded-xl">
            <h3 class="font-bold">Final Grade</h3>

            <p id="final" class="text-4xl font-bold text-green-600"></p>
          </div>
        </div>

        <div class="mt-6">
          <h3 class="font-bold">Remarks</h3>

          <p id="remarks" class="text-xl mt-2"></p>
        </div>
      </div>
    </div>

    <script type="module" src="./js/dashboard.js"></script>
  </body>
</html>
